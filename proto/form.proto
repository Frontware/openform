syntax = "proto3";

package weladee.form.v1;

option go_package = "github.com/weladee/weladee-form/proto/pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "proto/common.proto";

// Enums
enum FormStatus {
  FORM_STATUS_UNSPECIFIED = 0;
  FORM_STATUS_DRAFT = 1;
  FORM_STATUS_PUBLISHED = 2;
  FORM_STATUS_CLOSED = 3;
}

enum FormTheme {
  FORM_THEME_UNSPECIFIED = 0;
  FORM_THEME_MINIMAL = 1;
  FORM_THEME_MIDNIGHT = 2;
  FORM_THEME_OCEAN = 3;
  FORM_THEME_SUNSET = 4;
  FORM_THEME_FOREST = 5;
  FORM_THEME_LAVENDER = 6;
  FORM_THEME_WELADEE = 7;
  FORM_THEME_AURORA = 8;
  FORM_THEME_CYBERPUNK = 9;
  FORM_THEME_DESERT = 10;
}

enum QuestionType {
  QUESTION_TYPE_UNSPECIFIED = 0;
  QUESTION_TYPE_SHORT_TEXT = 1;
  QUESTION_TYPE_LONG_TEXT = 2;
  QUESTION_TYPE_DROPDOWN = 3;
  QUESTION_TYPE_CHECKBOXES = 4;
  QUESTION_TYPE_EMAIL = 5;
  QUESTION_TYPE_PHONE = 6;
  QUESTION_TYPE_NUMBER = 7;
  QUESTION_TYPE_DATE = 8;
  QUESTION_TYPE_RATING = 9;
  QUESTION_TYPE_OPINION_SCALE = 10;
  QUESTION_TYPE_YES_NO = 11;
  // Only for enterprise plans
  QUESTION_TYPE_FILE_UPLOAD = 12;
  QUESTION_TYPE_URL = 13;
  // Not available to SME plans
  QUESTION_TYPE_MATRIX = 14;
  // Only for enterprise plans
  QUESTION_TYPE_RANKING = 15;
}

enum ProgressBarStyle {
  PROGRESS_BAR_STYLE_UNSPECIFIED = 0;
  PROGRESS_BAR_STYLE_NONE = 1;
  PROGRESS_BAR_STYLE_LINEAR = 2;
  PROGRESS_BAR_STYLE_STEPS = 3;
  PROGRESS_BAR_STYLE_CIRCULAR = 4;
}

// Messages
message Question {
  string id = 1;
  string form_id = 2;
  QuestionType type = 3;
  string label = 4;
  string description = 5;
  string placeholder = 6;
  bool required = 7;
  int32 order_index = 8;
  google.protobuf.Struct options = 9;
  google.protobuf.Struct validation_rules = 10;
  google.protobuf.Struct settings = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message Form {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  FormTheme theme = 5;
  bool is_published = 6;
  bool is_accepting_responses = 7;
  bool require_login = 8;
  bool allow_multiple_submissions = 9;
  ProgressBarStyle progress_bar_style = 10;
  string custom_thank_you_message = 11;
  string redirect_url = 12;
  bool force_captcha = 13;
  google.protobuf.Struct settings = 14;
  repeated Question questions = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message FormStats {
  int64 total_responses = 1;
  int64 completed_responses = 2;
  int64 partial_responses = 3;
}

// RPC Requests/Responses
message CreateFormRequest {
  string title = 1;
  string description = 2;
  FormTheme theme = 3;
  ProgressBarStyle progress_bar_style = 4;
  repeated Question questions = 5;
  google.protobuf.Struct settings = 6;
}

message CreateFormResponse {
  Form form = 1;
}

message GetFormRequest {
  string id = 1;
  bool include_questions = 2;
}

message GetFormResponse {
  Form form = 1;
}

message GetFormBySlugRequest {
  string slug = 1;
}

message GetFormBySlugResponse {
  Form form = 1;
}

message UpdateFormRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional FormTheme theme = 4;
  optional bool is_published = 5;
  optional bool is_accepting_responses = 6;
  optional bool require_login = 7;
  optional bool allow_multiple_submissions = 8;
  optional ProgressBarStyle progress_bar_style = 9;
  optional string custom_thank_you_message = 10;
  optional string redirect_url = 11;
  optional bool force_captcha = 12;
  optional google.protobuf.Struct settings = 13;
}

message UpdateFormResponse {
  Form form = 1;
}

message DeleteFormRequest {
  string id = 1;
}

message DeleteFormResponse {
  bool success = 1;
}

// Sort options for ListForms
enum FormSortBy {
  FORM_SORT_BY_UNSPECIFIED = 0;
  FORM_SORT_BY_UPDATED_AT = 1;
  FORM_SORT_BY_CREATED_AT = 2;
  FORM_SORT_BY_TITLE = 3;
  FORM_SORT_BY_RESPONSE_COUNT = 4;
}

enum FormSortOrder {
  FORM_SORT_ORDER_UNSPECIFIED = 0;
  FORM_SORT_ORDER_ASC = 1;
  FORM_SORT_ORDER_DESC = 2;
}

enum FormStatusFilter {
  FORM_STATUS_FILTER_UNSPECIFIED = 0;
  FORM_STATUS_FILTER_DRAFT = 1;
  FORM_STATUS_FILTER_PUBLISHED = 2;
  FORM_STATUS_FILTER_CLOSED = 3;
}

message ListFormsRequest {
  PaginationRequest pagination = 1;
  optional string search_query = 2;
  optional bool published_only = 3;
  optional FormSortBy sort_by = 4;
  optional FormSortOrder sort_order = 5;
  optional FormStatusFilter status_filter = 6;
}

message ListFormsResponse {
  repeated Form forms = 1;
  PaginationResponse pagination = 2;
}

message PublishFormRequest {
  string id = 1;
}

message PublishFormResponse {
  Form form = 1;
}

message GetFormStatsRequest {
  string form_id = 1;
}

message GetFormStatsResponse {
  FormStats stats = 1;
}

// Question RPCs
message CreateQuestionRequest {
  string form_id = 1;
  QuestionType type = 2;
  string label = 3;
  string description = 4;
  string placeholder = 5;
  bool required = 6;
  int32 order_index = 7;
  google.protobuf.Struct options = 8;
  google.protobuf.Struct validation_rules = 9;
}

message CreateQuestionResponse {
  Question question = 1;
}

message UpdateQuestionRequest {
  string id = 1;
  optional QuestionType type = 2;
  optional string label = 3;
  optional string description = 4;
  optional string placeholder = 5;
  optional bool required = 6;
  optional int32 order_index = 7;
  optional google.protobuf.Struct options = 8;
  optional google.protobuf.Struct validation_rules = 9;
}

message UpdateQuestionResponse {
  Question question = 1;
}

message DeleteQuestionRequest {
  string id = 1;
}

message DeleteQuestionResponse {
  bool success = 1;
}

message ReorderQuestionsRequest {
  string form_id = 1;
  repeated string question_ids = 2;
}

message ReorderQuestionsResponse {
  bool success = 1;
}

// Form Service
service FormService {
  rpc CreateForm(CreateFormRequest) returns (CreateFormResponse);
  rpc GetForm(GetFormRequest) returns (GetFormResponse);
  rpc GetFormBySlug(GetFormBySlugRequest) returns (GetFormBySlugResponse);
  rpc UpdateForm(UpdateFormRequest) returns (UpdateFormResponse);
  rpc DeleteForm(DeleteFormRequest) returns (DeleteFormResponse);
  rpc ListForms(ListFormsRequest) returns (ListFormsResponse);
  rpc PublishForm(PublishFormRequest) returns (PublishFormResponse);
  rpc GetFormStats(GetFormStatsRequest) returns (GetFormStatsResponse);

  // Question management
  rpc CreateQuestion(CreateQuestionRequest) returns (CreateQuestionResponse);
  rpc UpdateQuestion(UpdateQuestionRequest) returns (UpdateQuestionResponse);
  rpc DeleteQuestion(DeleteQuestionRequest) returns (DeleteQuestionResponse);
  rpc ReorderQuestions(ReorderQuestionsRequest) returns (ReorderQuestionsResponse);
}
