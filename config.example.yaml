# Weladee Form Configuration Example
# Copy this file to config.yaml and modify the values for your environment

# gRPC Server Configuration
grpc_port: "50051"

# Database Configuration (Required)
database_url: "postgresql://username:password@localhost:5432/weladee_form"

# JWT Configuration
# Secret key for JWT token validation
# Change this in production and keep it secure!
jwt_secret: "weladee-form-secret-change-in-production"
# Paths to RSA keys for asymmetric signing (RS256)
# If configured, RS256 will be preferred over HS256 (jwt_secret)
# jwt_private_key_path: "./private_key.pem" # Only needed for creating tokens (CLI)
# jwt_public_key_path: "./public_key.pem"   # Needed for validating tokens (Server)

# reCAPTCHA v3 Configuration (Optional)
# Google reCAPTCHA v3 for bot protection on forms
# Get keys from: https://www.google.com/recaptcha/admin
recaptcha:
  enabled: false          # Global toggle for reCAPTCHA
  site_key: "your-site-key-here"
  secret_key: "your-secret-key-here"
  threshold: 0.5         # Score threshold (0.0-1.0), default 0.5

# S3 Storage Configuration (Optional)
# Required for file upload question type
# Supports AWS S3, Cloudflare R2, MinIO, and other S3-compatible storage
s3_region: "auto"
s3_bucket: "your-bucket-name"
s3_access_key: "your-access-key"
s3_secret_key: "your-secret-key"
s3_endpoint: "https://your-s3-endpoint.com"

# Environment variable examples:
# You can also set these via environment variables (higher priority than config.yaml):
# GRPC_PORT=50051
# DATABASE_URL=postgresql://...
# JWT_SECRET=your-jwt-secret
# RECAPTCHA_ENABLED=true
# RECAPTCHA_SITE_KEY=your-site-key
# RECAPTCHA_SECRET_KEY=your-secret-key
# RECAPTCHA_THRESHOLD=0.5
# S3_REGION=auto
# S3_BUCKET=your-bucket
# S3_ACCESS_KEY=your-key
# S3_SECRET_KEY=your-secret
# S3_ENDPOINT=https://...

# Command line examples:
# ./bin/weladee-form --database-url="postgresql://..." --grpc-port=8080
# ./bin/weladee-form -d "postgresql://..." -p 8080

# TEST TOKEN:
# For easy debugging, you can use "TEST_TOKEN" or "test-token" as the Bearer token
# This will authenticate as: test@weladee.com (User ID: 1, Role: admin)
