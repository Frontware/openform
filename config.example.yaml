# Weladee Form Configuration Example
# Copy this file to config.yaml and modify the values for your environment

# gRPC Server Configuration
grpc_port: "50051"

# Database Configuration (Required)
database_url: "postgresql://username:password@localhost:5432/weladee_form"

# Redis Configuration
redis_url: "redis://localhost:6379"
redis_prefix: "weladee:auth:token"

# SMTP Configuration (Required for email authentication)
smtp_host: "smtp.gmail.com"
smtp_port: "587"
smtp_username: "your-email@gmail.com"
smtp_password: "your-app-password"
smtp_from: "noreply@yourdomain.com"

# OAuth Configuration (Required for Google OAuth)
google_client_id: "your-google-client-id"
google_client_secret: "your-google-client-secret"
oauth_redirect_url: "http://localhost:3000/auth/callback"

# S3 Storage Configuration (Optional)
# Leave empty or remove if not using file uploads
s3_region: "auto"
s3_bucket: "your-bucket-name"
s3_access_key: "your-access-key"
s3_secret_key: "your-secret-key"
s3_endpoint: "https://your-s3-endpoint.com"

# Environment variable examples:
# You can also set these via environment variables:
# GRPC_PORT=50051
# DATABASE_URL=postgresql://...
# REDIS_URL=redis://...
# REDIS_KEY_PREFIX=weladee:auth:token
# SMTP_HOST=smtp.gmail.com
# SMTP_PORT=587
# SMTP_USERNAME=your-email@gmail.com
# SMTP_PASSWORD=your-app-password
# SMTP_FROM=noreply@yourdomain.com
# GOOGLE_CLIENT_ID=your-google-client-id
# GOOGLE_CLIENT_SECRET=your-google-client-secret
# OAUTH_REDIRECT_URL=http://localhost:3000/auth/callback
# S3_REGION=auto
# S3_BUCKET=your-bucket
# S3_ACCESS_KEY=your-key
# S3_SECRET_KEY=your-secret
# S3_ENDPOINT=https://...

# Command line examples:
# ./weladee-form --database-url="postgresql://..." --grpc-port=8080
# ./weladee-form -d "postgresql://..." -p 8080
